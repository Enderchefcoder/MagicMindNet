[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "magicmindnet"
version = "0.1.0"
description = "Beginner-friendly AI library: train chatbots, classifiers, and diffusion models with a from-scratch Rust core"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
keywords = ["ai", "machine-learning", "transformer", "chatbot", "beginner", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Enderchefcoder/MagicMindNet"
Documentation = "https://github.com/Enderchefcoder/MagicMindNet/blob/master/docs/getting_started.md"
Changelog = "https://github.com/Enderchefcoder/MagicMindNet/blob/master/CHANGELOG.md"

[project.optional-dependencies]
cuda = []
dev = ["pytest>=8.0", "maturin>=1.7", "ruff>=0.9", "numpy>=1.26", "h5py>=3.10"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["python", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.maturin]
manifest-path = "crates/mmn-py/Cargo.toml"
module-name = "magicmindnet._native"
python-source = "python"
features = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
